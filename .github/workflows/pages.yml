name: 0. Deploy site to GitHub Pages

# WHY THIS EXISTS
# The site (index.html + the *.json data files) lives in main's root. Previously Pages
# was set to "Deploy from a branch: main", so GitHub's built-in "pages build and
# deployment" fired on EVERY push to main. But the scraper workflows (hltb, tags,
# prices, playtime, ...) checkpoint-commit progress to main every ~5 minutes during
# their long, near-continuous runs — so main was pushed every 2-3 minutes and Pages
# rebuilt ~50+ times/day, each new build interrupting the previous one.
#
# This workflow decouples "data committed" from "site published":
#   - data checkpoints push to main freely and get published on the 30-min schedule;
#   - the prices job (2.1) also dispatches this workflow after every hourly pass, because
#     this cron is dropped/delayed like the others (2026-10-01: last fire 15:32, so the
#     17:00 storewide sale sat unpublished on main for hours);
#   - a push that touches index.html (the only file that changes how the site LOOKS)
#     publishes immediately.
# REQUIRES the repo Pages source to be switched from "Deploy from a branch" to
# "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source: GitHub
# Actions), otherwise the old branch build keeps running alongside this one.

on:
  workflow_dispatch:              # publish current main on demand
  push:
    branches: [main]
    paths:
      - index.html                # a look/layout change -> deploy right away
      - how-it-works.html         # the explainer page
      - monitor.html              # the pipeline monitor (its data, monitor.json, rides the 30-min republish)
      - stats.html                # Steam by the numbers (its data, stats.json, rides the same republish)
      - .github/workflows/pages.yml   # a change to WHAT gets published should publish it
      - seo_snapshot.py               # changes what the published page contains
      - sitemap.xml
      - og-image.png
      - favicon.svg
      - google*.html                  # search-engine ownership-check files
      - BingSiteAuth.xml
      - a65260491c6f4632ebff3dddf7f40f28.txt   # the IndexNow key file (a named path, not *.txt:
                                               # seeds_log.txt is a scraper output)
  schedule:
    - cron: "0,30 * * * *"        # republish current main every 30 min, on :00 and :30

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time. cancel-in-progress:false => if a manual/index-push deploy
# is running (e.g. started 13:59), the next scheduled run (14:00) QUEUES and waits for
# it to finish instead of interrupting it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Shallow + sparse (ARCHITECTURE §4 "Checkouts"). The full tree is ~2.3 GB, most of it
      # scraper input the site never serves (playtime_raw/ alone is 1.5 GB, then pics_raw/,
      # pics/, updates_raw/), and fetching it took ~4.5 min of every deploy (2026-11-09).
      # Cone mode, unlike the scraper jobs' explicit file lists: it always checks out every
      # ROOT file (index.html, the *.json layers, the scripts below, the search files), plus
      # the directories named here. With a sparse list, checkout is a partial clone, so blobs
      # outside it are never downloaded.
      # A NEW SERVED SUBDIRECTORY goes here AND in the stage step below.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            lookups
            shots

      # Stage exactly what the browser fetches: index.html, the root data layers, and the
      # SUBDIRECTORIES it also reads. `cp *.json` copies root files only, so any served
      # directory has to be named here explicitly (and in the sparse list above).
      #
      # This has bitten twice. `lookups/` (PICS id -> name decode maps, §9.6) was never
      # staged, so those ids silently failed to decode on the live site while working
      # locally. `shots/` (§2.2) then repeated it: every shard 404'd, the rotation never
      # started, and every server-side check still passed — the data was correct, the URLs
      # were correct, the code was correct, and none of it was published.
      #
      # ADDING A NEW SERVED FILE? If the frontend fetches it from a subdirectory, add it
      # here, or it will not exist in production no matter how right everything else is.
      # The check below fails the deploy rather than publishing a site with a missing
      # layer, so the next one announces itself here instead of in a hover that does
      # nothing.
      - name: Stage site files (index.html + served JSON, no source)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp *.json _site/
          # Root JSON no page fetches: scraper state and calibration inputs, committed to main for
          # the jobs that read them. Publishing them added ~82 MB (about a fifth of the JSON) to
          # every deploy for GitHub to sync, and that sync is the step that times out (2026-11-09).
          # An exclude list, not an allow-list, so a new data layer still publishes by default;
          # the verify step below fails the deploy if a page fetches a file named here.
          rm -f _site/*_state.json _site/hltb.json _site/hltb_igdb.json _site/catalog.json \
                _site/reviews_restore.json _site/length_coefs.json
          # The Review Digest's prompts (§17), fetched on first open of the digest modal. They were
          # never staged, so the live page fell back to its inline copies of them.
          cp review_prompt*.md _site/
          cp -r lookups _site/
          cp -r shots _site/ 2>/dev/null || echo "note: shots/ absent (layer not populated yet)"
          # Search / sharing files. favicon.svg was never staged, so the live tab icon 404'd.
          # sitemap.xml is submitted to Google Search Console / Bing Webmaster Tools; og-image.png
          # is the link-preview card. google*.html / BingSiteAuth.xml are the ownership-check
          # files those tools hand out — drop one in the repo root and it publishes with the site.
          cp favicon.svg sitemap.xml og-image.png _site/
          cp google*.html BingSiteAuth.xml _site/ 2>/dev/null || true
          # The explainer page (static, links back to the tool) and the IndexNow key file — a
          # 32-hex-character name with the key as its only content, which is how IndexNow proves
          # the pings below come from whoever controls this site. Public by design.
          cp how-it-works.html _site/
          cp monitor.html _site/
          cp stats.html _site/
          for f in *.txt; do [[ "$f" =~ ^[0-9a-f]{32}\.txt$ ]] && cp "$f" _site/; done; true

      # Stamp today's date (UTC) as <lastmod> on the tool's own URL in the PUBLISHED sitemap.
      # Honest because the page's data really does change every day (prices, sales, reviews).
      # The explainer page gets none: its content changes only with a commit, and this shallow
      # checkout cannot see per-file history, so any date here would be a guess.
      - name: Stamp sitemap lastmod
        run: |
          python3 - <<'PY'
          import time
          p = "_site/sitemap.xml"
          s = open(p, encoding="utf-8").read()
          loc = "<loc>https://mlmariss.github.io/SteamQTPD/</loc>"
          assert s.count(loc) == 1, "sitemap: tool URL not found exactly once"
          s = s.replace(loc, loc + "\n    <lastmod>" + time.strftime("%Y-%m-%d", time.gmtime()) + "</lastmod>")
          open(p, "w", encoding="utf-8").write(s)
          PY

      # Static "top picks" (from presets.json) into the PUBLISHED index.html only, for crawlers
      # that do not run JavaScript. Fails soft: no snapshot rather than no deploy.
      - name: Write SEO snapshot into the staged page
        run: python3 seo_snapshot.py _site/index.html presets.json

      # The "Ways to use QTPD" links put games in front of visitors who asked for nothing
      # specific, so each must carry adult=hide (house rule; presets.py holds the shelves to the
      # same). Also checks the section is static, folded natively, and not copied elsewhere.
      - name: Check the Ways to use QTPD section (adult=hide on every link)
        run: python3 test_ways_to_use.py

      # Covers fetch("x.json") and loadLayer("x.json") on every page, plus the quoted *.md names
      # index.html loads (the review prompts). Until 2026-11-09 it only matched fetch("…") in
      # index.html, so it checked none of the core layers (games, prices, pics, lookups/… all go
      # through loadLayer) and not the prompts, which were indeed missing.
      - name: Verify every path the frontend fetches is staged
        run: |
          missing=0
          for page in index.html stats.html monitor.html how-it-works.html; do
            for p in $( { grep -oE '(fetch|loadLayer)\("[^"]*\.json"' "$page" | sed -E 's/^[a-zA-Z]+\("//'
                          grep -oE '"[A-Za-z0-9_./-]+\.md"' "$page"; } | tr -d '"' | sort -u); do
              if [ ! -f "_site/$p" ]; then echo "MISSING from _site: $p (loaded by $page)"; missing=1; fi
            done
          done
          # shots/ is fetched with a computed shard name, so check the directory itself. Ask git,
          # not the disk: with a sparse checkout, a directory left off the list is absent on disk
          # too, and `[ -d shots ]` would wave it through.
          if grep -q 'fetch(`shots/' index.html && git ls-tree -d --name-only HEAD shots | grep -q . \
             && [ ! -d _site/shots ]; then
            echo "MISSING from _site: shots/ (in the repo but not staged; in the sparse list?)"; missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Refusing to publish a site with a data layer missing."; exit 1
          fi
          echo "All fetched paths present in _site."

      # configure-pages@v6, upload-pages-artifact@v5 and deploy-pages@v5 are the Node 24
      # releases (Node 20 runners are retired). upload-pages-artifact@v4+ leaves out dotfiles
      # unless include-hidden-files is set; _site has none, so nothing is lost.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # 20 min, not the action's default 10. GitHub's "syncing_files" phase normally takes ~4 min
      # for this site, but on 2026-11-09 it ran past 10 min twice in a row; the action then
      # cancelled both deploys, and two merged PRs stayed off the live site. A slow sync is
      # better finished than thrown away: the next deploy would sync the same files from scratch.
      # Cost: a deploy that really hangs holds the one-at-a-time "pages" queue 10 min longer.
      # (pages-watchdog.yml only clears deploys stuck in "waiting", never a running one.)
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000

      # IndexNow: tells Bing (which also feeds Copilot and DuckDuckGo), Yandex, Seznam and Naver
      # that the pages changed, so they recrawl in hours instead of whenever. Google ignores it.
      # Runs after the deploy, because the engines fetch the key file from the live site.
      # Throttled: this workflow publishes every 30 minutes, and pinging that often for the same
      # two URLs is the over-submission IndexNow asks sites not to do. So it pings when a push
      # changed the site's files, and on runs in the 06:00 UTC hour as the daily data refresh.
      # Never fails the deploy: a missed ping costs nothing the next one won't fix.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "$(date -u +%H)" != "06" ]; then
            echo "Not a page change and not the 06:00 UTC hour: skipping the ping."; exit 0
          fi
          key=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          [ -n "$key" ] || { echo "No IndexNow key file in the repo root: skipping."; exit 0; }
          base="https://mlmariss.github.io/SteamQTPD"
          body=$(printf '{"host":"mlmariss.github.io","key":"%s","keyLocation":"%s/%s.txt","urlList":["%s/","%s/how-it-works.html"]}' \
                 "$key" "$base" "$key" "$base" "$base")
          # 200/202 = accepted. Anything else is logged and ignored (see continue-on-error).
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
               -H "Content-Type: application/json; charset=utf-8" --data "$body"
