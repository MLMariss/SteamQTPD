name: 0. Deploy site to GitHub Pages

# WHY THIS EXISTS
# The site (index.html + the *.json data files) lives in main's root. Previously Pages
# was set to "Deploy from a branch: main", so GitHub's built-in "pages build and
# deployment" fired on EVERY push to main. But the scraper workflows (hltb, tags,
# prices, playtime, ...) checkpoint-commit progress to main every ~5 minutes during
# their long, near-continuous runs — so main was pushed every 2-3 minutes and Pages
# rebuilt ~50+ times/day, each new build interrupting the previous one.
#
# This workflow decouples "data committed" from "site published":
#   - data checkpoints push to main freely and get published on the 30-min schedule;
#   - the prices job (2.1) also dispatches this workflow after every hourly pass, because
#     this cron is dropped/delayed like the others (2026-10-01: last fire 15:32, so the
#     17:00 storewide sale sat unpublished on main for hours);
#   - a push that touches index.html (the only file that changes how the site LOOKS)
#     publishes immediately.
# REQUIRES the repo Pages source to be switched from "Deploy from a branch" to
# "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source: GitHub
# Actions), otherwise the old branch build keeps running alongside this one.

on:
  workflow_dispatch:              # publish current main on demand
  push:
    branches: [main]
    paths:
      - index.html                # a look/layout change -> deploy right away
      - .github/workflows/pages.yml   # a change to WHAT gets published should publish it
  schedule:
    - cron: "0,30 * * * *"        # republish current main every 30 min, on :00 and :30

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time. cancel-in-progress:false => if a manual/index-push deploy
# is running (e.g. started 13:59), the next scheduled run (14:00) QUEUES and waits for
# it to finish instead of interrupting it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # Stage exactly what the browser fetches: index.html, the root data layers, and the
      # SUBDIRECTORIES it also reads. `cp *.json` copies root files only, so any served
      # directory has to be named here explicitly.
      #
      # This has bitten twice. `lookups/` (PICS id -> name decode maps, §9.6) was never
      # staged, so those ids silently failed to decode on the live site while working
      # locally. `shots/` (§2.2) then repeated it: every shard 404'd, the rotation never
      # started, and every server-side check still passed — the data was correct, the URLs
      # were correct, the code was correct, and none of it was published.
      #
      # ADDING A NEW SERVED FILE? If the frontend fetches it from a subdirectory, add it
      # here, or it will not exist in production no matter how right everything else is.
      # The check below fails the deploy rather than publishing a site with a missing
      # layer, so the next one announces itself here instead of in a hover that does
      # nothing.
      - name: Stage site files (index.html + served JSON, no source)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp *.json _site/
          cp -r lookups _site/
          cp -r shots _site/ 2>/dev/null || echo "note: shots/ absent (layer not populated yet)"

      - name: Verify every path the frontend fetches is staged
        run: |
          missing=0
          for p in $(grep -o 'fetch("[^"]*\.json"' index.html | sed 's/fetch("//; s/"//'); do
            if [ ! -f "_site/$p" ]; then echo "MISSING from _site: $p"; missing=1; fi
          done
          # shots/ is fetched with a computed shard name, so check the directory itself.
          if grep -q 'fetch(`shots/' index.html && [ -d shots ] && [ ! -d _site/shots ]; then
            echo "MISSING from _site: shots/ (exists in repo but was not staged)"; missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Refusing to publish a site with a data layer missing."; exit 1
          fi
          echo "All fetched paths present in _site."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
