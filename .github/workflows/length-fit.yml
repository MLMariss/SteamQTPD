name: 3.3 Length calibration (weekly) -> length_coefs.json

on:
  workflow_dispatch:        # run manually any time
  schedule:
    # Weekly refit of the per-genre coefficients that turn ▲ (recommenders' median
    # playtime) into the site's Length, calibrated against REAL HowLongToBeat "extra"
    # times. HLTB is backend-only since Sep 2026: this job is the only consumer of
    # hltb.json. The coefficients move slowly (each genre fits on hundreds to thousands
    # of games), so weekly is plenty; the fit logs a WARNING when one moves >10%.
    # Pure local recompute (~10s), no network. It writes length_coefs.json ONLY: length.json
    # belongs to 2.3's chained Length step (one writer per file). It used to re-apply too,
    # and 03:17 lands mid-way through 2.3's 01:23 pass, so every Monday the two commits
    # conflicted and 2.3's was dropped. 2.3's commits reset onto main's tip (gitsync.py), so the
    # new coefficients reach length.json when the pass in progress ends (~50 min later).
    - cron: "17 3 * * 1"    # Mondays 03:17 UTC

permissions:
  contents: write           # commits length_coefs.json

concurrency:
  group: steam-length       # never overlap itself; the only writer of length_coefs.json
  cancel-in-progress: false

jobs:
  length-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1      # shallow: nothing reads history (ARCHITECTURE §4 "Checkouts")

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refit genre coefficients against HLTB extra
        run: python length_model.py --fit
