name: 2.1 Prices + sale dates -> prices.json

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    # HOURLY, but not for the reason a cron usually is: the run keeps its own clock and
    # loops passes on the hour for ~5 hours (RUN_MINUTES below), so this schedule is a
    # WATCHDOG, not the cadence. GitHub delivers scheduled events 30-160 min late and
    # drops about a third of them on a repo with this many crons — at "every 3 hours"
    # that meant ~5 passes a day with gaps up to 7.8h, and nothing landing near Steam's
    # 17:00 UTC discount flip. Firing every hour means a dropped or delayed event costs
    # an hour instead of most of a day; the concurrency group below collapses the ones
    # that arrive while a run is still going (they queue, they don't pile up).
    - cron: "0 * * * *"

permissions:
  contents: write           # commits prices.json as it runs

concurrency:
  group: steam-prices       # never overlap price runs (separate from scraper/recent/hltb)
  cancel-in-progress: false # a run in flight always finishes; a newer pending one waits

jobs:
  prices:
    runs-on: ubuntu-latest
    # RUN_MINUTES=300 + checkout/install overhead; under the 6h hard cap, same as 1.0/2.4.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git (script commits progress itself, rebasing onto main)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh prices and sale end-dates
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          QHPP_CC: "US"
          # 300min budget = ~5 hourly passes per run. A full sweep of the ~110k non-free
          # catalog takes ~52min wall (1,107 batches x 1.6s + the on-sale end-date pass),
          # so a 60min pass window fits with slack and the next pass starts on the hour.
          # The run ends when it can't fit another whole pass; the cron above starts the
          # next one, and the concurrency group means a queued event takes over
          # immediately rather than waiting for its own slot.
          RUN_MINUTES: "300"
          PASS_ALIGN_MINUTE: "0"
        run: python price_and_sale.py
