name: 2.8 Store trailers -> trailers.json

on:
  workflow_dispatch:        # run manually from the Actions tab
    inputs:
      dump:
        description: "Dump the raw GetItems trailers blob + probe CDN hosts, then exit (no writes)"
        type: boolean
        default: false
  schedule:
    # Mostly a backlog drain: after the first pass it picks up new games (released and
    # upcoming), misses aged past QTPD_TRAILER_MISS_TTL (30d), and re-checks each known
    # trailer every QTPD_TRAILER_VERIFY_DAYS (60d) so a replaced one doesn't go dead —
    # ~1/60 of the catalogue a day. Minutes of work. GitHub delivers this cron hours late
    # on this repo, so the minute buys nothing; GetItems is the big api.steampowered.com
    # budget, not the storefront one, so it contends with nobody anyway.
    - cron: "13 5 * * *"

permissions:
  contents: write           # commits trailers.json + trailers_state.json as it runs

concurrency:
  group: steam-trailers     # never overlap trailer runs
  cancel-in-progress: false

jobs:
  trailers:
    runs-on: ubuntu-latest
    timeout-minutes: 115     # RUN_MINUTES=100 + headroom
    steps:
      - uses: actions/checkout@v5
        with:
          # The REF THAT TRIGGERED the run, not a hardcoded "main". On the schedule that
          # resolves to main exactly as before; on a manual dispatch from a branch it
          # actually runs that branch's code. With `ref: main` hardcoded, dispatching a
          # schema-check from a fix branch silently re-ran the code being fixed.
          # Writing to main stays safe: git_checkpoint refuses to push from a non-main
          # checkout, so a branch run can only ever be a dry run.
          ref: ${{ github.ref_name }}
          # Real runs never needed depth 0: every commit goes through gitsync.py, which fetches
          # main's tip only (--depth=1) and resets onto it, so no history is ever read.
          # Shallow + sparse: only this job's files (ARCHITECTURE §4 "Checkouts"). Full history
          # (fetch-depth: 0) was 9.6 GB and ~30 min of every run, and nothing here reads history;
          # with a sparse list, checkout is also a partial clone, so nothing else is downloaded.
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /trailers.py
            /games.json
            /upcoming.json
            /trailers.json
            /trailers_upcoming.json
            /trailers_state.json
            /gitsync.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git (script commits progress itself, rebasing onto main)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Index store trailers
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          QHPP_CC: "US"
          # 100min at GETITEMS_DELAY=1.2s and 50 appids/call is ~5,000 batches — more
          # than the whole ~127k catalog needs, so the very first run drains the entire
          # backlog in one go and every run after it is near-instant.
          RUN_MINUTES: "100"
          QTPD_DUMP_TRAILERS: ${{ inputs.dump && '1' || '0' }}
        run: python trailers.py
