name: 2.4 Game update events raw -> updates_raw/ shards

on:
  workflow_dispatch:        # run manually
  schedule:
    # As many shard buckets per run as RUN_MINUTES allows, the one written longest ago
    # first, each committed as it finishes (updates_refresh.py). It did ONE bucket per run
    # (GITHUB_RUN_NUMBER % 64): ~40 of 180 minutes used, every game revisited every ~16
    # days, so the 7-day cooldown for actively updated games could not be met.
    #
    # STOREFRONT BUDGET NOTE: this endpoint (store.steampowered.com/events/…) is on the
    # ~200/5min storefront budget. That budget is per runner IP, and each job runs on its
    # own runner, so it competes with no other job; STORE_DELAY 1.6s keeps this one at
    # ~190/5min. Once the backlog left by the one-bucket design drains (~3 days), a day's
    # due games are ~75 minutes of calls. WATCH 403 rates after deploy: if they climb,
    # raise STORE_DELAY to 2.0. GitHub delivers this cron hours late on this repo, so
    # the minute is no protection; the concurrency group is what prevents overlap.
    - cron: "53 2,8,14,20 * * *"

permissions:
  contents: write           # commits each updates_raw/NN.json shard it finishes + updates.json

concurrency:
  group: steam-updates      # never overlap updates runs (own group)
  cancel-in-progress: false

jobs:
  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 330     # under the 6h cap; RUN_MINUTES stays well inside
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # Shallow + sparse: only this job's files (ARCHITECTURE §4 "Checkouts"). Full history
          # (fetch-depth: 0) was 9.6 GB and ~30 min of every run, and nothing here reads history;
          # with a sparse list, checkout is also a partial clone, so nothing else is downloaded.
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /updates_refresh.py
            /updates_summarize.py
            /games.json
            /updates_raw/
            /updates.json
            /gitsync.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git (script commits during the run, hard-reset onto main)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh update events (event_type-classified, sharded)
        env:
          RUN_MINUTES: "180"
          STORE_DELAY: "1.6"      # conservative storefront pacing; raise to 2.0 if 403s spike
        run: python updates_refresh.py

      # After the raw shard is refreshed and committed above, recompute the small
      # frontend-facing updates.json from ALL shards. Self-commits its one file on top
      # of main (gitsync.py) — one-writer-per-file holds (the raw job never writes
      # updates.json; only this step does). `if: always()` so a soft-failing raw pass
      # (e.g. a 403 storefront-budget wrap-up) still republishes the summary from
      # whatever shards exist on disk.
      - name: Summarize update events -> updates.json
        if: always()
        run: python updates_summarize.py
