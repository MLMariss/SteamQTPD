name: 4.3 Freshness check -> FRESHNESS.md

on:
  workflow_dispatch:          # run manually any time
  schedule:
    # Once daily at 07:00 UTC — the morning oversight pass. Deliberately placed AFTER
    # 4.1 shard-health (06:35) and after the 06:00 scrape slot has had an hour to land
    # its games.json + trailing COVERAGE.md, so the snapshot reads a settled tree rather
    # than one mid-commit. Read-only w.r.t. every external service (it only scans local
    # files and the workflow crons), so it costs no storefront budget.
    - cron: "0 7 * * *"

permissions:
  contents: write             # commits FRESHNESS.md

concurrency:
  group: freshness-md         # one-writer-per-file (FRESHNESS.md); can't clobber the data jobs
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # reads games.json + every shard set; ~1-2 min in practice
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # freshness.py imports coverage.py for its cooldown constants and bucketers;
      # both are standard-library only, so there is no pip install step.

      - name: Generate FRESHNESS.md
        run: python freshness.py

      # FRESHNESS.md is single-writer, so main's tip plus our file never loses anyone's work.
      # gitsync.py retries and FAILS LOUD if the push can't land — no silent green runs.
      - name: Commit FRESHNESS.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python gitsync.py -m "freshness: refresh FRESHNESS.md" FRESHNESS.md
