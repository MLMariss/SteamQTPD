name: 2.14 Player counts -> players.json

# Hourly player counts for the top 100 and a watchlist, a sweep of the whole catalogue every
# 2 hours, and the games spiking against their own last week. See players.py and ARCHITECTURE §7.
#
# One run stays up for RUN_MINUTES and takes a snapshot every hour, because GitHub drops most
# crons on this repo: the first day, the hourly cron fired 0 times in 4 hours and the price
# job's dispatch only arrives while a price run is up. Any trigger that lands while a run is up
# waits in the concurrency group and starts when it ends, so the runs follow each other.
on:
  schedule:
    - cron: "52 * * * *"      # starts the next run; one in five firing is enough
  workflow_dispatch:          # also dispatched by the price job after every pass
                              # (price_and_sale.py trigger_deploy). From a branch: a dry run.

permissions:
  contents: write             # commits players.json + players_state.json + players_raw/

concurrency:
  group: steam-players        # one writer per file; players.py skips a snapshot under 45 min after the last
  cancel-in-progress: false

jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 345      # RUN_MINUTES + a last snapshot that is a sweep (~20 min) + headroom
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Shallow + sparse: only this job's files (ARCHITECTURE §4 "Checkouts").
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /players.py
            /players.json
            /players_state.json
            /players_raw/
            /games.json
            /pics.json
            /tags.json
            /stats.py
            /gitsync.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git (players.py commits its files itself)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record player counts
        env:
          RUN_MINUTES: "300"
        run: python players.py
