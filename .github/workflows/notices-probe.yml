name: 0.6 Store notices probe [manual] -> run log + artifact

on:
  workflow_dispatch:          # MANUAL — a one-off diagnostic for Denuvo / 3rd-party account / anti-cheat filters.
    inputs:
      appids:
        description: "Extra comma-separated appids to check (a hand-picked list is built in)"
        required: false
        default: ""
      sample:
        description: "Released games to sample for how common each notice is"
        required: false
        default: "100"
  # Also runs when the probe itself changes on a claude/ working branch, so its answer is in
  # that branch's checks before anything merges (workflow_dispatch only sees main's workflows).
  # Read-only and ~170 Steam calls at 1.5s, so an extra run costs nothing that matters.
  push:
    branches: ["claude/**"]
    paths:
      - notices_probe.py
      - .github/workflows/notices-probe.yml

# READ-ONLY, like demo-probe.yml: commits nothing. Findings go to the run log and the job
# summary; the raw payloads go out as a build artifact.
permissions:
  contents: read

concurrency:
  group: notices-probe
  cancel-in-progress: false

jobs:
  notices-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # ~170 calls at 1.5s is ~5 min, plus 403 cool-downs
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false   # only what the probe reads (ARCHITECTURE §4 "Checkouts")
          sparse-checkout: |
            /notices_probe.py
            /games.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "requests>=2.31"

      - name: Probe Steam for DRM / account / anti-cheat notices
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}   # optional; GetItems also answers keyless
          QTPD_PROBE_APPIDS: ${{ inputs.appids }}
          QTPD_PROBE_SAMPLE: ${{ inputs.sample || '100' }}
        run: python notices_probe.py

      - name: Upload findings
        if: always()           # a partial dump is still worth having when a probe fails
        uses: actions/upload-artifact@v7
        with:
          name: notices-probe-findings
          path: notices_probe_out/
          retention-days: 14
          if-no-files-found: warn
