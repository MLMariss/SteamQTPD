name: 4.1 Shard health -> SHARDS.md

on:
  workflow_dispatch:          # run manually anytime
  schedule:
    # Once daily. Read-only w.r.t. external services (just scans local shard files), so
    # there's no storefront-budget concern — pick a quiet minute clear of the data jobs.
    - cron: "35 6 * * *"

permissions:
  contents: write             # commits SHARDS.md

concurrency:
  group: shards-md            # one-writer-per-file (SHARDS.md); can't clobber the data jobs
  cancel-in-progress: false

jobs:
  shard-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate SHARDS.md
        run: python shard_health.py

      # SHARDS.md is single-writer, so main's tip plus our file never loses anyone's work.
      # gitsync.py retries and FAILS LOUD if the push can't land — no silent green runs.
      - name: Commit SHARDS.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python gitsync.py -m "shard health: refresh SHARDS.md" SHARDS.md
