name: 2.7 PICS metadata -> pics.json

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "Fetch time budget in minutes"
        default: "240"
      stale_days:
        description: "Skip games refreshed within N days (0 = refresh all)"
        default: "14"
  schedule:
    # Staggered off the storefront-facing scrapers. PICS uses a separate CM
    # session (not the storefront HTTP budget), but we still offset to keep
    # commit traffic tidy. 03:20 UTC daily.
    - cron: "20 3 * * *"

permissions:
  contents: write

concurrency:
  group: steam-pics
  cancel-in-progress: false

jobs:
  pics:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 deliberate: checkout v5 preserves the credential-persistence the
      # fetch -> reset -> push commit pattern (gitsync.py) relies on (v6/v7 changed it).
      - uses: actions/checkout@v5
        with:
          # Shallow + sparse: only this job's files (ARCHITECTURE §4 "Checkouts"). Full history
          # (fetch-depth: 0) was 9.6 GB and ~30 min of every run, and nothing here reads history;
          # with a sparse list, checkout is also a partial clone, so nothing else is downloaded.
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pics_refresh.py
            /pics_summarize.py
            /pics_merge.py
            /games.json
            /upcoming.json
            /pics_raw/
            /pics/
            /pics.json
            /pics_upcoming.json
            /companies.json
            /gitsync.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install steam gevent gevent-eventemitter "protobuf<3.21"

      # -------- Stage 1: fetch raw PICS common blocks (Layer 1) --------
      - name: Refresh PICS raw
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          python pics_refresh.py \
            --catalog games.json \
            --catalog upcoming.json \
            --out pics_raw \
            --stale-days "${{ github.event.inputs.stale_days || '14' }}" \
            --run-minutes "${{ github.event.inputs.run_minutes || '240' }}" \
            --checkpoint-min 15

      # -------- Stage 2: derive frontend view (Layer 2) --------
      - name: Summarize PICS -> pics/ shards
        run: |
          python pics_summarize.py --in pics_raw --out pics

      # -------- Stage 3: merge 64 shards -> single slim pics.json (frontend) --------
      # The frontend loads one file per data source (games/prices/tags/...); this
      # merges the pics/ shards into the single pics.json index.html actually fetches,
      # dropping parked backend-only fields (dev/pub/franchise/langs/audio) for a
      # ~37% smaller transfer. Without this step pics.json never gets written.
      - name: Merge PICS shards -> pics.json
        run: |
          python pics_merge.py --in pics --out pics.json

      # -------- Commit (gitsync.py: main's tip + our paths, with retries) --------
      # main is pushed to CONTINUOUSLY by a dozen sibling scrapers, and this job's push is one of
      # the slowest in the repo — pics.json + 64 raw shards is ~40 MB, so the upload alone takes
      # ~25s. A sibling often lands first; gitsync re-fetches main's tip, puts our paths back on
      # it and pushes again. A single-shot push used to throw the WHOLE run away on that race
      # (3 of 10 runs to 2026-09-09: Sep-7 releases still had no capsule art on Sep 9). It no
      # longer rebases: a plain fetch + rebase in this shallow clone downloaded the whole history
      # of any old-based PR merged mid-run and hung there (gitsync.py, ARCHITECTURE §4).
      # Nothing to commit -> exit 0; can't land after 8 attempts -> red run.
      - name: Commit pics_raw + pics + pics.json + pics_upcoming.json + companies.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python gitsync.py -m "Refresh PICS metadata ($(date -u +'%Y-%m-%d %H:%M') UTC)" \
            pics_raw pics pics.json pics_upcoming.json companies.json
