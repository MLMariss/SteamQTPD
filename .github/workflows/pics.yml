name: 2.7 PICS metadata -> pics.json

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "Fetch time budget in minutes"
        default: "240"
      stale_days:
        description: "Skip games refreshed within N days (0 = refresh all)"
        default: "14"
  schedule:
    # Staggered off the storefront-facing scrapers. PICS uses a separate CM
    # session (not the storefront HTTP budget), but we still offset to keep
    # commit traffic tidy. 03:20 UTC daily.
    - cron: "20 3 * * *"

permissions:
  contents: write

concurrency:
  group: steam-pics
  cancel-in-progress: false

jobs:
  pics:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 deliberate: checkout v5 preserves the credential-persistence the
      # fetch -> rebase -> push commit pattern relies on (v6/v7 changed it).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install steam gevent gevent-eventemitter "protobuf<3.21"

      # -------- Stage 1: fetch raw PICS common blocks (Layer 1) --------
      - name: Refresh PICS raw
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          python pics_refresh.py \
            --catalog games.json \
            --out pics_raw \
            --stale-days "${{ github.event.inputs.stale_days || '14' }}" \
            --run-minutes "${{ github.event.inputs.run_minutes || '240' }}" \
            --checkpoint-min 15

      # -------- Stage 2: derive frontend view (Layer 2) --------
      - name: Summarize PICS -> pics/ shards
        run: |
          python pics_summarize.py --in pics_raw --out pics

      # -------- Stage 3: merge 64 shards -> single slim pics.json (frontend) --------
      # The frontend loads one file per data source (games/prices/tags/...); this
      # merges the pics/ shards into the single pics.json index.html actually fetches,
      # dropping parked backend-only fields (dev/pub/franchise/langs/audio) for a
      # ~37% smaller transfer. Without this step pics.json never gets written.
      - name: Merge PICS shards -> pics.json
        run: |
          python pics_merge.py --in pics --out pics.json

      # -------- Commit (fetch -> rebase -> push, with retries) --------
      # main is pushed to CONTINUOUSLY by a dozen sibling scrapers (recent/updates/
      # playtime/shots/trailers/...), and this job's push is one of the slowest in the
      # repo — pics.json + 64 raw shards is ~40 MB, so the upload alone takes ~25s.
      # That is a wide window for a sibling to land first, and the old single-shot
      # `push` then died with "cannot lock ref 'refs/heads/main'" and threw away the
      # WHOLE run: raw blocks, shards and pics.json all discarded, so every game first
      # seen since the last successful run kept `art: null` and rendered a blank
      # thumbnail until some later run happened to win the race. It lost 3 of the 10
      # runs to 2026-09-09 (Sep 3, 7, 8) — which is exactly why Sep-7 releases still had
      # no capsule art on Sep 9.
      #
      # So: retry, the same way every other writer in this repo already does
      # (recent_refresh.py, shots.py, trailers.py, freshness.yml, ...) — re-fetch and
      # replay onto the new main each attempt, with jittered backoff. The commit is a
      # pure add of files no sibling touches, so the replay is always clean.
      #
      # The old `|| git merge -s ours origin/main` fallback is deliberately GONE: on a
      # rebase failure it would have committed a merge that keeps OUR side of every
      # conflicting path, silently reverting whatever a sibling had just pushed. A
      # failed rebase here means something is genuinely wrong; abort it and retry.
      - name: Commit pics_raw + pics + pics.json
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pics_raw pics pics.json
          if git diff --staged --quiet; then
            echo "No changes this run"
            exit 0
          fi
          git commit -m "Refresh PICS metadata ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3 + RANDOM % 5))
          done
          echo "ERROR: could not push PICS refresh after 8 attempts"; exit 1
