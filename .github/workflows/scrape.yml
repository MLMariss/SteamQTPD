name: 1. Steam game catalog -> games.json

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    # Every 6h on the clock (00:00 / 06:00 / 12:00 / 18:00 UTC). With RUN_MINUTES=330
    # (5.5h) and cancel-in-progress:false, a new run queues right as the previous one
    # ends, so the scraper covers ~22h/day — near-continuous backlog clearing.
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write           # the scraper commits games.json + catalog.json as it runs

concurrency:
  group: steam-scrape       # never overlap runs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330     # under the 6h hard cap; keep JOB_TIMEOUT_MINUTES below equal to this
    steps:
      # First, before the checkout: scraper.py caps its budget at what is left of THIS clock, so
      # however long setup takes, the final save lands inside timeout-minutes (§6, job-clock cap).
      - name: Record job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: main
          # Shallow + sparse (ARCHITECTURE §4 "Checkouts"). Full history (fetch-depth: 0) was
          # 9.6 GB and took ~32 min of every run; nothing here reads history — the commit is
          # fetch + rebase + push, and seeds come from `git show origin/main:seeds.txt`, both
          # fine on a depth-1 clone. The sparse list is every file scraper.py reads or writes;
          # with it set, checkout also makes a partial clone, so nothing else is downloaded.
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scraper.py
            /requirements.txt
            /games.json
            /catalog.json
            /upcoming.json
            /pics.json
            /seeds.txt
            /seeds_log.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git (scraper commits progress itself)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scraper
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}   # optional; enables clean full-catalog + smart refresh
          RUN_MINUTES: "330"                            # 5.5h budget per run (near-continuous with 6h cron)
          JOB_TIMEOUT_MINUTES: "330"                    # = timeout-minutes; the job-clock cap reads it
          # --- null-update backlog drain tuning (Jul 2026) ---
          # Aggressive while we close the ~48k null last_update_ts gap. REVERT after:
          # raise STOREFRONT_MIN_INTERVAL back toward ~1.4-1.5 for steady state, and
          # FORCE_RESERVE_FRAC can drop to ~0.2. See ARCHITECTURE.md §16 revert note.
          STOREFRONT_MIN_INTERVAL: "0.9"                # shared storefront pace (was effective ~3s/game)
          FORCE_RESERVE_FRAC: "0.5"                     # min share of each run for the forced drain
        run: python scraper.py
