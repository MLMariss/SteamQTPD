name: 4.4 Preset shelves -> presets.json

on:
  workflow_dispatch:          # run manually any time
  workflow_run:
    # Trails the main scrape, like the other generated-file jobs: the shelves are measured
    # against games.json, so they are only worth recomputing once it has moved.
    # NOTE: workflow_run matches the upstream workflow's exact current `name:` — if
    # scrape.yml is ever renamed, this string goes stale and the trigger silently stops
    # firing (that has happened before; see coverage.yml's note).
    workflows: ["1. Steam game catalog -> games.json"]
    types: [completed]

permissions:
  contents: write             # commits presets.json

concurrency:
  group: presets-json         # one-writer-per-file (presets.json); never overlaps itself
  cancel-in-progress: false

jobs:
  presets:
    runs-on: ubuntu-latest
    # Skip on a cancelled/failed scrape so the shelves are never measured against a
    # half-written games.json. Manual dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1      # shallow: nothing reads history (ARCHITECTURE §4 "Checkouts")

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # presets.py uses only the standard library — no pip install needed.

      - name: Generate presets.json
        run: python presets.py | tee presets-report.txt

      # The shelf definitions live in presets.py under version control and are NEVER retuned
      # here — this job only ever measures them. A shelf that has gone thin or broad is
      # surfaced in the step summary so it is visible in the Actions UI without opening the
      # diff, and is left for a human to decide about.
      - name: Report shelf health
        run: |
          {
            echo '### Preset shelves'
            echo '```'
            cat presets-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^PROBLEMS:' presets-report.txt; then
            echo "::warning title=Preset shelves need attention::$(sed -n '/^PROBLEMS:/,$p' presets-report.txt | tail -n +2 | tr '\n' ' ')"
          fi

      # Other jobs commit to main continuously, all to DIFFERENT files: gitsync.py puts
      # presets.json on main's tip and retries if one lands mid-push (red run if it can't).
      - name: Commit presets.json
        run: |
          rm -f presets-report.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python gitsync.py -m "presets: refresh shelf counts" presets.json
