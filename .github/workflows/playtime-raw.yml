name: 2.3 Game playtime raw -> playtime_raw/ shards

on:
  workflow_dispatch:        # run manually (also used for deep passes via DEEPEN_TARGET)
  schedule:
    # AGGRESSIVE 8-slot pass (was 4× at :23 of 2,8,14,20). Now :23 every 3h — hours
    # 1,4,7,10,13,16,19,22 — i.e. near-continuous playtime scraping (~23h/day, up from
    # ~12h/day) to backfill review times faster now that scrape.py finishes in ~7 min.
    # Each run processes MANY shard buckets (up to MAX_SHARDS_PER_RUN), chosen by a
    # STALENESS SWEEP: oldest-scraped shards first, so the whole 64-shard set cycles on a
    # bounded schedule and no shard can starve. The earlier hot-first selection (rank by
    # due-count) let a stable hot core monopolise the slots and stay fresh while every
    # other shard fell back to the once-per-run anchor — i.e. the ~8-day tail that left
    # Black Flag Resynced (shard 27) un-refreshed for 8 days. The GITHUB_RUN_NUMBER % 64
    # anchor is retained only as a floor. Per-game priority still lives WITHIN a shard
    # (the overdue-ratio ladder), so hot games are served first once their shard opens.
    # Runs were finishing 12 shards in ~23 of 180 min, so the cap was raised 12 -> 24
    # (the time was always there). NOTE the "~8 h full sweep" that used to be claimed here
    # never happened: measured shard `generated_at` ages were median 46 h / worst 81 h,
    # with only 7 of 64 shards inside 8 h. Two reasons, both now addressed — runs were
    # overrunning the cron gap so only 4-5 of the 8 fires actually ran (see RUN_MINUTES
    # below), and MAX_SHARDS_PER_RUN is never reached anyway because every run stops on
    # TIME, not on work. Treat 24 as a ceiling that does not bind, not as a rate.
    # FORCE_SHARDS="27" (or a CSV) can pin specific buckets into a manual run to push a
    # known game through on demand. Shards are loaded, worked and committed ONE AT A TIME,
    # so commits stay small and peak memory stays at ~one shard. The :23 offset starts each run AFTER the :07 prices slot
    # (60-min runs) has wound down. NOTE: the ~200/5min storefront budget is nominally
    # shared with prices (:07 every 3h, 60min), recent (:41 of 4,10,16,22, 180min) and
    # scrape. With STEAM_DELAY now 1.5s (200/5min, no headroom) this leans on the budget
    # hard — but recent already sustains 3h@1.5s successfully (separate runner IPs), so
    # this is expected to hold. WATCH 403 rates after deploy: if they spike, revert delay
    # to 2.0 and/or drop to fewer slots. The concurrency group below keeps raw runs from
    # overlapping each other. (hltb :53 / tags :29 hit different hosts.)
    - cron: "23 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write           # commits one playtime_raw/NN.json shard per run (auto-migrates the old monolith on first run)

concurrency:
  group: steam-playtime-raw # never overlap raw-scrape runs (own group)
  cancel-in-progress: false

jobs:
  playtime-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 330     # under the 6h cap; RUN_MINUTES stays well inside
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # SHALLOW ON PURPOSE. This was fetch-depth: 0 and it was the single largest
          # cost in the job: measured on run #480, `actions/checkout` took 15m36s of a
          # 238-minute run. Every commit in this repo rewrites a ~21 MB shard file, so
          # full history is enormous and none of it is used — the script only ever needs
          # the current tree plus the ability to push.
          #
          # Safe because _robust_commit() does `git fetch origin main` +
          # `git reset --hard FETCH_HEAD` + `git push origin HEAD:main`. There is no
          # rebase and no history walk, and FETCH_HEAD is written by an explicit fetch in
          # a shallow clone exactly as in a full one. Verified end to end against a real
          # shallow clone: a concurrent commit from another shard's writer is picked up
          # by FETCH_HEAD, its file survives the reset, and our commit pushes on top.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git (script commits per shard, resetting onto origin/main)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh review playtime (identity-keyed, sentiment-split)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}   # optional (appreviews is keyless)
          # 180 -> 165 so the WHOLE JOB fits inside the 3-hour cron gap. Measured runs
          # took 191-320 min against a 180-min gap, and because the concurrency group
          # uses cancel-in-progress: false (and GitHub keeps only ONE pending run per
          # group) every fire that landed while a run was still going was silently
          # discarded. Actual throughput was 4-5 runs/day, not the 8 the cron implies.
          # Budget now: 165 scrape + ~1.2 summarize + shallow checkout ≈ 168 min, which
          # leaves real headroom inside 180. Net scraping time per day goes UP, not down:
          # 8 x 165 = 1,320 min/day versus the 810 min/day that 4-5 x 180 actually
          # delivered. If runs still overrun after this, lower again rather than widening
          # the cron — the 8 slots are what keep shard rotation inside its window.
          RUN_MINUTES: "165"
          TARGET_REVIEWS: "200"        # reviews aimed for per game on a normal pass
          # Max shard buckets one run may open, oldest-scraped first (staleness sweep).
          # This is a CEILING, not a rate: no run has ever reached it. Every measured run
          # spent its entire time budget (191-320 min of a nominal 180), so the binding
          # constraint is RUN_MINUTES and the per-shard work, not this number. Raising it
          # would change nothing; lower it only if 403s show the storefront budget is the
          # bottleneck. Real shard rotation is tracked in COVERAGE.md, not predicted here.
          MAX_SHARDS_PER_RUN: "24"
          SHARD_MIN_HOT: "1"           # skip shards with fewer due games than this
          # PHASE 0 — first-touch fast lane. Games with no stored record at all are
          # served across ALL buckets before the rotation starts, newest-release-first,
          # at one page each. Without it a new release waits for its shard's turn (~46 h
          # median, ~81 h worst), which was the entire day-1..day-5 coverage hole.
          # 300/run x 8 runs/day also drains the ~15,600-game frontier created by the
          # MIN_REVIEWS_FLOOR 10 -> 5 drop in about a week, without letting any single
          # run spend its whole budget on backfill. Set to 0 to disable the phase.
          FIRST_TOUCH_BATCH: "300"
          # FORCE_SHARDS: "27"         # manual override: pin bucket(s) into this run,
          #                            # processed first (CSV ok, e.g. "27,5"); for pushing
          #                            # a specific game through without waiting for the sweep.
          # One-off DEEP pass: run this workflow manually and set a higher target
          # (capped at PER_GAME_CAP = DEPTH_LADDER[-1] = 3000 in the script — this
          # comment said 1000 for a long time after the ladder grew). It resumes each
          # game by review identity, catching new reviews AND walking deeper into
          # unseen ones.
          # DEEPEN_TARGET: "3000"
        run: python playtime_refresh.py

      # After the raw shards are refreshed and committed above, recompute the small
      # frontend-facing files from the just-updated shards. Each summarizer reads the
      # shard dir directly, self-commits its ONE file (playtime.json / ratings.json)
      # and rebases onto main — one-writer-per-file holds (raw job never writes those
      # two files itself; only these steps do). This closes the raw-vs-summarized lag:
      # previously the summarizers had no cron and only ran by hand, so playtime.json /
      # ratings.json drifted behind the shards. `if: always()` so a soft-failing raw
      # pass (e.g. 403 budget) still publishes summaries from whatever shards exist.
      - name: Summarize playtime medians -> playtime.json
        if: always()
        run: python playtime_summarize.py

      - name: Summarize playtime-weighted ratings -> ratings.json
        if: always()
        run: python ratings_summarize.py

      # Length (the site's one game-length figure) is ▲ × a per-genre coefficient, so it
      # is recomputed from the playtime.json written two steps up. Coefficients come from
      # length_coefs.json (refit weekly by 3.3); this step only applies them.
      - name: Review-based Length -> length.json
        if: always()
        run: python length_model.py
